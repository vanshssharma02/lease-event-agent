name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Evaluation Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code quality linting (Ruff)
        run: |
          python -m ruff check app/ ui/ eval/ tests/ scripts/

      - name: Run Pytest Test Suite
        env:
          LLM_MODE: mock
        run: |
          python -m pytest tests/ -v

      - name: Run Automated Isolated Smoke Test
        env:
          LLM_MODE: mock
        run: |
          python scripts/smoke_test.py

      - name: Run Benchmark Evaluation Harness
        env:
          LLM_MODE: mock
        run: |
          python -m eval.run_eval --runs 2

      - name: Verify Evaluation Artifacts
        run: |
          test -s eval/results.json
          test -s eval/RESULTS.md
